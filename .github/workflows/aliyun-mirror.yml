name: Aliyun Mirror

# GitHub Release 发布后，把附件和给 UI 用的 update.json / CHANGELOG.md 同步到阿里云 OSS。
# GitHub 仍是主发布源；阿里云只做国内检查更新和下载镜像。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要同步的已有 Release tag，例如 v1.5.4.1；留空则同步最新 Release"
        required: false
  schedule:
    # 每 6 小时兜底同步一次最新 Release；正常发版由 release published 立即触发
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
      OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName')
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release assets
        run: |
          mkdir -p dist
          gh release download "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" --pattern '*.zip' --dir dist --clobber

      - name: Install ossutil
        run: |
          curl -fsSL -o ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.4.1/ossutil-2.4.1-linux-amd64.zip
          unzip -q ossutil.zip -d ossutil
          BIN=$(find ossutil -type f -name ossutil | head -n1)
          chmod +x "$BIN"
          echo "OSSUTIL=$BIN" >> "$GITHUB_ENV"
          "$BIN" version

      - name: Prepare mirror files
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          ASSET=$(ls dist/*.zip | head -n1)
          NAME=$(basename "$ASSET")
          SHA=$(sha256sum "$ASSET" | awk '{print $1}')
          TMP=$(mktemp -d)
          unzip -q "$ASSET" module.prop -d "$TMP"
          VER=$(sed -n 's/^version=//p' "$TMP/module.prop" | head -n1 | tr -d '\r')
          CODE=$(sed -n 's/^versionCode=//p' "$TMP/module.prop" | head -n1 | tr -d '\r')
          unzip -q "$ASSET" changelog.md -d "$TMP"
          cp -f "$TMP/changelog.md" dist/CHANGELOG.md
          if unzip -q "$ASSET" engine.json -d "$TMP" 2>/dev/null; then
            cp -f "$TMP/engine.json" dist/engine.json
          fi

          cat > dist/update.json <<EOF
          {
            "version": "$VER",
            "versionCode": $CODE,
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/$TAG/$NAME",
            "aliyunZipUrl": "https://$OSS_BUCKET.oss-cn-hangzhou.aliyuncs.com/module/$NAME",
            "changelog": "https://$OSS_BUCKET.oss-cn-hangzhou.aliyuncs.com/CHANGELOG.md",
            "sha256": "$SHA"
          }
          EOF
          cat dist/update.json

          cat > dist/manager-update.json <<EOF
          {
            "version": "$VER",
            "versionCode": $CODE,
            "zipUrl": "https://$OSS_BUCKET.oss-cn-hangzhou.aliyuncs.com/module/$NAME",
            "changelog": "https://$OSS_BUCKET.oss-cn-hangzhou.aliyuncs.com/CHANGELOG.md",
            "sha256": "$SHA"
          }
          EOF
          cat dist/manager-update.json

          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload to Aliyun OSS
        run: |
          set -e
          CFG="$RUNNER_TEMP/ossutilconfig"
          cat > "$CFG" <<EOF
          [default]
          accessKeyID=$OSS_ACCESS_KEY_ID
          accessKeySecret=$OSS_ACCESS_KEY_SECRET
          region=cn-hangzhou
          endpoint=https://$OSS_ENDPOINT
          EOF
          "$OSSUTIL" cp -f "$ASSET" "oss://$OSS_BUCKET/module/$NAME" --config-file "$CFG"
          "$OSSUTIL" cp -f dist/update.json "oss://$OSS_BUCKET/update.json" --config-file "$CFG"
          "$OSSUTIL" cp -f dist/manager-update.json "oss://$OSS_BUCKET/manager-update.json" --config-file "$CFG"
          "$OSSUTIL" cp -f dist/CHANGELOG.md "oss://$OSS_BUCKET/CHANGELOG.md" --config-file "$CFG"
          [ ! -f dist/engine.json ] || "$OSSUTIL" cp -f dist/engine.json "oss://$OSS_BUCKET/engine.json" --config-file "$CFG"
          "$OSSUTIL" ls "oss://$OSS_BUCKET/module/$NAME" --config-file "$CFG"
