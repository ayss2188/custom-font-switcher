name: build-cfs-verify
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true
      - name: Build arm64 verifier
        run: |
          which aarch64-linux-android21-clang
          aarch64-linux-android21-clang -O2 -fPIE -pie -Wl,--gc-sections -s -I tools/cfs-verify \
            -o cfs-verify tools/cfs-verify/verify.c tools/cfs-verify/monocypher.c
          ls -l cfs-verify
      - uses: actions/upload-artifact@v4
        with:
          name: cfs-verify-arm64
          path: cfs-verify
