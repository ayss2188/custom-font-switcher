name: Release

# 两种触发方式（任选其一）：
#   1. 网页上点：Actions -> Release -> Run workflow（推荐，不需要会 git）
#   2. 推送 v* 标签（例如 git tag v1.1 && git push origin v1.1）
#
# 发版铁律（2026-10-12 用一次真事故换来的）：一个版本只发一次。
#   发布成功之后不要再重跑这个工作流 —— 重跑会把同一版本号下的附件换成新文件，
#   而用户手里/缓存里的账本还指着上一个包 => "看得到更新、点了却装不上"（v1.0.6 就是这么坏的）。
#   要改内容就发下一个版本号（v1.0.8），而不是重发 v1.0.7。
#
# 这个工作流做三件事：
#   1. 打包（用 module\ 里的源码打刷机包）
#   2. 建 Release（附件只传这一次）
#   3. 从**线上附件**回读指纹，写出 update.json 并提交（账本里记的指纹永远等于实物）
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 检查版本号
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/^version=//p' module/module.prop | tr -d '\r')
          CODE=$(sed -n 's/^versionCode=//p' module/module.prop | tr -d '\r')
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "$VER" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 module.prop 里的 version=$VER 不一致"
            exit 1
          fi
          if grep -q '__REPO__' module/module.prop; then
            echo "::error::module.prop 里还是 __REPO__ 占位符，请把它改成 你的用户名/仓库名"
            exit 1
          fi
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "::error::Release $VER 已经存在。发新版前请先把 module.prop 里的 version 和 versionCode 改大"
            exit 1
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: 打包
        id: build
        run: |
          VER=$(sed -n 's/^version=//p' module/module.prop | tr -d '\r')
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          find module -type f \( -name '*.sh' -o -name '*.prop' -o -name '*.list' -o -name '*.html' -o -name '*.py' -o -name 'update-binary' -o -name 'updater-script' \) \
            -exec sed -i 's/\r$//' {} +
          # 包里那份更新日志 = **完整 CHANGELOG**（含历史），界面里能滚动看全部历史。
          # 2026-10-12 曾把这里改成"只截本版那一段"，结果历史全没了（作者立刻指出）——
          #   历史必须保留。当时看到的"包里是下一版日志"是因为**并行开发**：
          #   发 1.0.7 之前 CHANGELOG 顶部已经写好了 1.0.8 的段落。
          #   正常发版时 顶部 == 本次发布 == 用户装的那一版，三者一致，不会有这个问题。
          cp -f CHANGELOG.md module/changelog.md
          if ! cmp -s CHANGELOG.md module/changelog.md; then
            echo "::error::module/changelog.md 与 CHANGELOG.md 不一致（包里会带错更新日志）"
            exit 1
          fi
          # ★ 防线：CHANGELOG 顶部的版本必须 == 本次发布的版本。
          # 2026-10-12 踩过：发 1.0.7 时 CHANGELOG 顶部已经写了 1.0.8（并行开发），
          #   结果 1.0.7 的包里，用户看到的"更新日志"开头是下一版的内容。
          #   这里直接拦住：顶部不是本版 → 报红，让你先决定"是改日志还是改版本号"。
          TOP=$(grep -m1 '^## ' CHANGELOG.md | sed 's/^##[[:space:]]*//')
          if [ "$TOP" != "$VER" ]; then
            echo "::error::CHANGELOG.md 顶部是「$TOP」，但你正在发「$VER」—— 包里的日志会错位。"
            echo "         要么把 ## $VER 挪到最上面，要么先别把下一版写进 CHANGELOG。"
            exit 1
          fi
          echo "日志顶部版本校验通过：$TOP"
          echo "包内更新日志：完整 CHANGELOG（$(wc -l < module/changelog.md) 行）"
          sh scripts/build.sh
          sha256sum dist/custom-font-switcher.zip | cut -d' ' -f1 > dist/sha256.txt
          echo "构建产物 sha256: $(cat dist/sha256.txt)"

      - name: 提取本版更新说明
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          # ★ 2026-10-17 改：**优先用作者写的发布文案 UPDATE-<版本>.md**
          #   以前只从 CHANGELOG 抽"## 版本"那一段，而 CHANGELOG 是流水账，
          #   里面没有「怎么升级」「遇到问题怎么办」这两节 ——
          #   结果 Release 页面比作者写的文案少了结尾（真机发版时发现）。
          if [ -s "UPDATE-$VER.md" ]; then
            cp "UPDATE-$VER.md" dist/notes.md
            echo "用 UPDATE-$VER.md 作为 Release 说明（$(wc -c < dist/notes.md) 字节）"
          else
            awk -v v="## $VER" '
              $0 == v { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' CHANGELOG.md > dist/notes.md
            echo "仓库里没有 UPDATE-$VER.md，退回到从 CHANGELOG 抽取"
          fi
          [ -s dist/notes.md ] || echo "见 CHANGELOG.md" > dist/notes.md

      - name: 发布 Release（附件只上传这一次）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          gh release create "$VER" dist/custom-font-switcher.zip \
            --target main \
            --title "自定义字体切换模块 $VER" \
            --notes-file dist/notes.md

      - name: 回读线上附件取指纹 + 写出账本并提交
        # 指纹必须来自**线上附件本身**（用户真正下载到的东西），不能信"构建时算过的值"。
        # 账本文件名就用标准那一个：update.json（module.prop 里指的就是它）。
        id: ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER="${{ steps.ver.outputs.ver }}"
          CODE="${{ steps.ver.outputs.code }}"
          REPO="${GITHUB_REPOSITORY}"
          SHA=$(gh api "repos/$REPO/releases/tags/$VER" --jq '.assets[0].digest' 2>/dev/null | sed 's/^sha256://')
          case "$SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) echo "用 API 给的 digest：$SHA" ;;
            *)
              echo "拿不到 digest 字段，改为下载线上附件自行计算"
              rm -f dist/published.zip
              gh release download "$VER" -p custom-font-switcher.zip -O dist/published.zip --clobber
              SHA=$(sha256sum dist/published.zip | cut -d' ' -f1)
              ;;
          esac
          case "$SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "::error::算不出线上附件指纹（SHA='$SHA'）—— 拒绝写账本"; exit 1 ;;
          esac
          echo "线上附件指纹：$SHA"
          # ★ 2026-10-17 修：以前这里是 `head -n 20 dist/notes.md > UPDATE-$VER.md`
          #   —— 无条件覆盖，会把作者手写的发布文案**硬截断**（正好断在条目中间）。
          #   现在跟子项目 CI 一致：**仓库里已经有就原样保留**，没有才用 notes 兜底。
          if [ -s "UPDATE-$VER.md" ]; then
            _un=$(wc -c < "UPDATE-$VER.md")
            echo "UPDATE-$VER.md 已存在（$_un 字节）—— 原样保留，不覆盖"
          else
            cp dist/notes.md "UPDATE-$VER.md"
            echo "仓库里没有 UPDATE-$VER.md，已用 dist/notes.md 兜底生成"
          fi
          # ★ 账本里的 changelog 指向 **CHANGELOG.md（完整历史）**，不指向按版本命名的短日志。
          # 为什么（作者要求，2026-10-12）：管理器点更新时弹的窗、以及界面的「更新日志」，
          #   都应该能看到**历史**；短日志只有本版那一小段，用户翻不到以前的改动。
          printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "zipUrl": "https://github.com/%s/releases/download/%s/custom-font-switcher.zip",\n  "changelog": "https://cdn.jsdelivr.net/gh/%s@main/CHANGELOG.md",\n  "sha256": "%s"\n}\n' \
            "$VER" "$CODE" "$REPO" "$VER" "$REPO" "$SHA" > update.json
          cat update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json "UPDATE-$VER.md"
          git commit -m "更新账本：$VER" || echo "没有变化"
          # 推 main 可能被"你正在上传文件"顶掉（non-fast-forward）。这一步失败 = 用户收不到更新，
          #   所以重试必须带"最终失败判定"（以前只 break 不判定，5 次全失败还是绿的）。
          ok=0
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then ok=1; break; fi
            echo "推送失败，第 $i 次重试..."
            git pull --rebase origin main || true
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            echo "::error::账本没能推上去 —— 所有用户都收不到更新（这一步必须红）"
            exit 1
          fi

      - name: 主动刷新 CDN 缓存（重试 + 自查，让用户尽快收到更新）
        # 背景：CDN 会缓存 update.json，内容更新了用户读到的还是旧那份。
        # 2026-10-12 完整实测（踩了三轮才搞清）：
        #   · purge 的语义是"删这份缓存、下次回源"，**对文件内容有效**；
        #   · 但 jsDelivr 还有一层"**main 分支名 → 哪个提交**"的解析缓存，purge 清不掉它 ——
        #     所以有时 purge 完回源拿到的还是旧内容（别名还指着旧提交）。
        #   · 发 1.0.8 时真遇到：CI 的 purge 那步 success 了，但 CDN 仍给 1.0.7；
        #     手动再 purge 一次才跳到 1.0.8。
        # 所以这里改成**多轮重试 + 每轮自查**：能刷到就提前结束，刷不到也把状态打出来（不当失败）。
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          URL="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/update.json"
          ok=0
          for i in 1 2 3 4 5 6; do
            for f in "update.json" "CHANGELOG.md"; do
              curl -sS --max-time 25 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" >/dev/null 2>&1 || true
            done
            sleep 12
            GOT=$(curl -sS --max-time 25 "$URL" 2>/dev/null | sed -n 's/.*"version"[^"]*"\([^"]*\)".*/\1/p' | head -n1)
            echo "第 $i 轮：CDN 上的 update.json = ${GOT:-（读不到）}（期望 $VER）"
            if [ "$GOT" = "$VER" ]; then ok=1; break; fi
          done
          if [ "$ok" = 1 ]; then
            echo "CDN 已刷新：用户现在检查更新就能看到 $VER"
          else
            echo "::warning::CDN 还没跟上（jsDelivr 的 main 别名缓存，最长约 12 小时自愈）。"
            echo "  · 不影响手动下载安装（Release 页那条路不走 CDN）；"
            echo "  · 不影响包与账本的正确性（仓库里已经是对的）。"
          fi
